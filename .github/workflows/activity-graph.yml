name: Activity graph

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - scripts/activity_graph.py
      - .github/workflows/activity-graph.yml
      - pyproject.toml
      - uv.lock
      - .python-version

permissions:
  contents: write

concurrency:
  group: activity-graph
  cancel-in-progress: true

env:
  # Fail rather than update a stale uv.lock.
  UV_LOCKED: 1

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Python from .python-version, with the packages in uv.lock.
      - uses: astral-sh/setup-uv@v10.3.3

      - name: Render activity graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run scripts/activity_graph.py "${{ github.repository_owner }}" dist/activity-graph.svg 31

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
